<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="海边日落的插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d596d"/>
      <stop offset=".38" stop-color="#d78983"/>
      <stop offset=".66" stop-color="#f3b394"/>
      <stop offset="1" stop-color="#ffd9ae"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6a78"/>
      <stop offset=".45" stop-color="#b47b7e"/>
      <stop offset="1" stop-color="#e6a58f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d3b1"/>
      <stop offset="1" stop-color="#e9b492"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe8c8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe8c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="820" cy="360" r="270" fill="url(#sunGlow)"/>
